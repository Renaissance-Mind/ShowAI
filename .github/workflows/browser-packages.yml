name: Browser distributions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run package:browser
      - run: npm run test:browser
      - run: node scripts/browser-package-smoke.mjs
      - run: npx playwright install chromium
      - run: npm run test:whiteboard
      - uses: actions/upload-artifact@v4
        with:
          name: ShowAI-browser-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/ShowAI-browser-*.tar.gz
            release/ShowAI-browser-*.zip
            artifacts/browser-package-smoke.json
