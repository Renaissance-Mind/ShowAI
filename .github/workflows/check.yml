name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Pushes to main arrive often; only the newest commit of each ref needs a result.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check
      # Tests start the built CLI, MCP server and reader, so build first.
      - run: npm run build
      - run: npm test
      - run: npm run test:release
      - run: npm run test:whiteboard
      - run: npm audit --audit-level=high
