name: Windows
# Run manually: the suite does not pass on Windows yet (paths, openssl/python3, compiled test helpers
# without .exe, locked files), so it is kept out of the per-push Check.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: npm run check
      - run: npm run build
      - run: npx vitest run --maxWorkers=2 --testTimeout=30000 --hookTimeout=30000
      - run: node src/desktop/smoke.mjs
      - run: node src/desktop/ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShowAI-windows-desktop-check
          path: output/playwright/desktop-ui-*/
          if-no-files-found: ignore
