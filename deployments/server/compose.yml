services:
  showai:
    build:
      context: ../..
      dockerfile: deployments/server/Dockerfile
    ports:
      - "8788:8788"
    environment:
      SHOWAI_SERVER_NAME: ${SHOWAI_SERVER_NAME:-ShowAI Server}
      SHOWAI_SERVER_URL: ${SHOWAI_SERVER_URL:-http://localhost:8788}
      SHOWAI_REGISTRATION_KEY: ${SHOWAI_REGISTRATION_KEY:-}
      SHOWAI_REGISTRATION_MODE: ${SHOWAI_REGISTRATION_MODE:-controlled}
      SHOWAI_REGISTRATION_LIMIT: ${SHOWAI_REGISTRATION_LIMIT:-20}
      SHOWAI_ACCOUNT_LIMIT: ${SHOWAI_ACCOUNT_LIMIT:-10000}
      SHOWAI_STORAGE_POLICY: ${SHOWAI_STORAGE_POLICY:-}
      SHOWAI_REQUEST_POLICY: ${SHOWAI_REQUEST_POLICY:-}
      SHOWAI_OPERATIONS_KEY: ${SHOWAI_OPERATIONS_KEY:-}
      SHOWAI_ALLOWED_ORIGINS: ${SHOWAI_ALLOWED_ORIGINS:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
