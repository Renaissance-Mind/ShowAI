<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="208" viewBox="0 0 1200 208" role="img" aria-labelledby="title description">
<title id="title">对 Agent · 对人</title>
<desc id="description">获得一个面向人的表达与协作界面，把信息和分析转化为人可以理解、操作与反馈的内容。 获得一个参与 AI 工作的认知界面，通过阅读、探索和修改，把自己的理解与判断带入共同创作。</desc>
