<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="238" viewBox="0 0 1200 238" role="img" aria-labelledby="title description">
<title id="title">Agent에게 · 사람에게</title>
<desc id="description">사람에게 정보를 표현하고 협업하는 인터페이스입니다. 정보와 분석을 사람이 이해하고, 조작하고, 피드백할 수 있는 콘텐츠로 바꿀 수 있습니다. AI의 작업에 참여하는 인터페이스입니다. 읽기, 탐색, 편집을 통해 자신의 이해와 판단을 공동 제작에 반영할 수 있습니다.</desc>
<g font-family="Apple SD Gothic Neo, Arial, Noto Sans CJK SC, sans-serif">
