<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-labelledby="title description">
<title id="title">Agent にとって · 人にとって</title>
<desc id="description">人への表現と協働のためのインターフェースです。情報や分析を、人が理解し、操作し、フィードバックできるコンテンツに変えられます。 AI の作業に参加するためのインターフェースです。読解、探索、編集を通じて、自分の理解や判断を共同制作に反映できます。</desc>
