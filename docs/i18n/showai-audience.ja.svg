</g>
<text x="72" y="42" font-size="25" font-weight="600" fill="#087DB8">Agent にとって</text>
<text x="72" font-size="22" font-weight="400" fill="#243B4A">
<tspan x="72" y="73">人への表現と協働のためのインターフェースです。情報や分析を、人が理解し、操作し、フィードバックでき</tspan>
<tspan x="72" y="103">るコンテンツに変えられます。</tspan>
