<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowAI 图标 · 三分区</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1eff8;color:#41385c;font-family:system-ui,sans-serif}main{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.panel{padding:52px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}.dark{background:#100b26;color:#d7cfee}.large{width:min(100%,360px);height:auto}.label{font-size:14px;letter-spacing:.12em}.sizes{display:flex;align-items:center;gap:22px;height:64px}.sizes img{display:block}.sizes .size64{width:64px}.sizes .size32{width:32px}.sizes .size16{width:16px}@media(max-width:640px){main{grid-template-columns:1fr}.panel{padding:40px 32px}}
</style></head><body><main>
<section class="panel"><img class="large" src="./showai-funnel-light.svg" alt="亮色版：宽口漏斗，三个连续紫色渐变区域"><span class="label">亮色模式</span><div class="sizes"><img class="size64" src="./showai-funnel-light.svg" alt="64像素"><img class="size32" src="./showai-funnel-light.svg" alt="32像素"><img class="size16" src="./showai-funnel-light.svg" alt="16像素"></div></section>
<section class="panel dark"><img class="large" src="./showai-funnel-dark.svg" alt="暗色版：紫色渐变，宽口曲线在底部略微交叉"><span class="label">暗色模式</span><div class="sizes"><img class="size64" src="./showai-funnel-dark.svg" alt="64像素"><img class="size32" src="./showai-funnel-dark.svg" alt="32像素"><img class="size16" src="./showai-funnel-dark.svg" alt="16像素"></div></section>
</main></body></html>
