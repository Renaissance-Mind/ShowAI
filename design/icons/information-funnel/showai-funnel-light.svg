<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="showai-light-title showai-light-description">
  <title id="showai-light-title">ShowAI information funnel — light</title>
  <desc id="showai-light-description">Two equal-radius semicircles intersect near the lower quarter of the square. A rounded violet connection preserves the waist thickness. Neutral sides surround a continuous gray lavender to deep indigo gradient, darkening downward through RGB(18, 10, 143).</desc>
  <defs>
    <linearGradient id="showai-light-region-1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0%" stop-color="#C2BDE6"/>
      <stop offset="45%" stop-color="#8174BF"/>
      <stop offset="71.576077%" stop-color="#120A8F"/>
      <stop offset="100%" stop-color="#08033A"/>
    </linearGradient>
    <clipPath id="showai-light-frame"><rect width="512" height="512" rx="88"/></clipPath>
  </defs>
  <g clip-path="url(#showai-light-frame)">
    <path id="showai-light-left" d="M -300 -8 A 600 600 0 0 1 -300 1192 Z" fill="#FFFFFF"/>
    <path id="showai-light-right" d="M 812 -8 A 600 600 0 0 0 812 1192 Z" fill="#FFFFFF"/>
    <path id="showai-light-center" d="M -202.347555 0 H 714.347555 A 600 600 0 0 0 217.357250 512 H 294.642750 A 600 600 0 0 0 -202.347555 0 Z" fill="url(#showai-light-region-1)" fill-rule="evenodd" stroke="url(#showai-light-region-1)" stroke-width="52" stroke-linejoin="round"/>
  </g>
</svg>
