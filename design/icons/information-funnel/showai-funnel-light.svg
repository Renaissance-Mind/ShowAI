    <path id="showai-light-right" d="M 576 0 C 468 0 352 96 310 246 C 277 352 267 384 256 426 C 267 470 285 497 304 512 H 512 V 0 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>
</svg>
