<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="showai-light-title showai-light-description">
  <title id="showai-light-title">ShowAI information funnel — light</title>
  <desc id="showai-light-description">Two curved boundaries divide the entire square into three regions and converge at the bottom edge. Each region uses a continuous teal gradient.</desc>
  <defs>
    <linearGradient id="showai-light-region-0" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0%" stop-color="#91D5CF"/>
      <stop offset="50%" stop-color="#53ACA9"/>
      <stop offset="100%" stop-color="#2B7D88"/>
    </linearGradient>
    <linearGradient id="showai-light-region-1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0%" stop-color="#DDF7EA"/>
      <stop offset="50%" stop-color="#8ADFC8"/>
      <stop offset="100%" stop-color="#299F9A"/>
    </linearGradient>
    <linearGradient id="showai-light-region-2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0%" stop-color="#58B1AD"/>
      <stop offset="50%" stop-color="#2A8592"/>
      <stop offset="100%" stop-color="#185B75"/>
    </linearGradient>
    <clipPath id="showai-light-frame"><rect width="512" height="512" rx="88"/></clipPath>
  </defs>
  <g clip-path="url(#showai-light-frame)">
    <path id="showai-light-center" d="M 0 0 H 512 C 377 0 302 202 280 324 C 265 406 264 461 264 512 H 248 C 248 461 247 406 232 324 C 210 202 135 0 0 0 Z" fill="url(#showai-light-region-1)"/>
    <path id="showai-light-left" d="M 0 0 C 135 0 210 202 232 324 C 247 406 248 461 248 512 L 0 512 Z" fill="url(#showai-light-region-0)" stroke="url(#showai-light-region-0)" stroke-width="0.5"/>
    <path id="showai-light-right" d="M 512 0 C 377 0 302 202 280 324 C 265 406 264 461 264 512 L 512 512 Z" fill="url(#showai-light-region-2)" stroke="url(#showai-light-region-2)" stroke-width="0.5"/>
  </g>
</svg>
