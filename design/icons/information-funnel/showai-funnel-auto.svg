<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="showai-auto-title showai-auto-description">
  <title id="showai-auto-title">ShowAI information funnel — auto</title>
  <desc id="showai-auto-description">An extra-wide funnel with smoothly rounded boundaries and neutral sides and a continuous violet gradient that darkens downward through RGB(18, 10, 143). The curves form a broad waist at 71.5 percent of the height, then open into a larger lower section that meets the frame.</desc>
  <defs>
    <style>
      :root{--side:#FFFFFF}
      @media (prefers-color-scheme:dark){:root{--side:#0A0A0A}}
    </style>
    <linearGradient id="showai-auto-region-1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0%" stop-color="#C8C2F1"/>
      <stop offset="50%" stop-color="#7465CD"/>
      <stop offset="71.484375%" stop-color="#120A8F"/>
      <stop offset="100%" stop-color="#090447"/>
    </linearGradient>
    <clipPath id="showai-auto-frame"><rect width="512" height="512" rx="88"/></clipPath>
  </defs>
  <g clip-path="url(#showai-auto-frame)">
    <path id="showai-auto-center" d="M -80 32 V -32 H 592 V 32 C 496 32 284 124 284 366 C 284 434 306 475 342 512 H 170 C 206 475 228 434 228 366 C 228 124 16 32 -80 32 Z" fill="url(#showai-auto-region-1)"/>
    <path id="showai-auto-left" d="M -80 32 C 16 32 228 124 228 366 C 228 434 206 475 170 512 H -80 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5" style="fill:var(--side,#FFFFFF);stroke:var(--side,#FFFFFF)"/>
    <path id="showai-auto-right" d="M 592 32 C 496 32 284 124 284 366 C 284 434 306 475 342 512 H 592 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5" style="fill:var(--side,#FFFFFF);stroke:var(--side,#FFFFFF)"/>
  </g>
</svg>
