<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'self' about:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"><meta name="showai-source-revision" content="ede9a3b9f4f571e8ae0cd99c92a7d2adf700c942"><title>UI review</title><style>:root {
  color-scheme: light;
  --rv-paper: #ffffff;
  --rv-panel: #faf9f6;
  --rv-line: #e2dfd8;
  --rv-text: #292823;
  --rv-muted: #6c695f;
  --rv-accent: #6845a5;
  --rv-tint: #f1ecfa;
  font:
    14px/1.45 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
  color: var(--rv-text);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--rv-paper);
}
button,
input {
  font: inherit;
}
button {
  color: inherit;
  cursor: pointer;
}
button:disabled {
  opacity: 0.48;
  cursor: default;
}
:focus-visible {
  outline: 2px solid var(--rv-accent);
  outline-offset: 2px;
}
[hidden] {
  display: none !important;
}
.rv-shell {
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
}
.rv-head {
  min-height: 52px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 16px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--rv-line);
  background: var(--rv-panel);
}
.rv-head h1 {
  flex: 1;
  min-width: max-content;
  margin: 0;
  font-size: 16px;
  font-weight: 650;
}
.rv-tools,
.rv-tools label {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.rv-tools {
  gap: 7px 12px;
  font-size: 13px;
}
.rv-tools input {
  margin: 0;
  accent-color: var(--rv-accent);
}
.rv-tools button,
.rv-states button,
.rv-home {
  background: var(--rv-paper);
  border: 1px solid var(--rv-line);
  border-radius: 6px;
  padding: 5px 9px;
}
.rv-info {
  position: relative;
}
.rv-info summary,
.rv-motion summary {
  cursor: pointer;
  list-style: none;
}
.rv-info summary {
  padding: 5px 9px;
  border: 1px solid var(--rv-line);
  border-radius: 6px;
  background: var(--rv-paper);
}
.rv-info[open] summary {
  border-color: #c5b4e5;
  color: var(--rv-accent);
}
.rv-info-body {
  position: absolute;
  z-index: 10;
  right: 0;
  width: 324px;
  max-width: calc(100vw - 24px);
  max-height: calc(100dvh - 90px);
  overflow: auto;
  margin: 8px 0 0;
  padding: 15px 18px;
  border: 1px solid var(--rv-line);
  border-radius: 12px;
  background: var(--rv-paper);
  box-shadow:
    0 14px 38px -9px #1517253b,
    0 2px 6px #1517250d;
}
.rv-info-body dt {
  color: var(--rv-muted);
  font-size: 12px;
}
.rv-info-body dd {
  margin: 2px 0 12px;
  overflow-wrap: anywhere;
}
.rv-info-body dd:last-child {
  margin-bottom: 0;
}
.rv-tools button[aria-expanded="true"],
.rv-states button[aria-pressed="true"] {
  border-color: #c5b4e5;
  color: var(--rv-accent);
  background: var(--rv-tint);
}
.rv-body {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 294px;
}
.rv-stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.rv-stage iframe,
.rv-marks,
.rv-loading {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.rv-loading {
  z-index: 3;
  display: grid;
  place-items: center;
  background: var(--rv-panel);
  color: var(--rv-muted);
}
.rv-inspector {
  min-height: 0;
  overflow: auto;
  padding: 16px;
  background: var(--rv-panel);
  border-left: 1px solid var(--rv-line);
}
.rv-inspector section + section {
  border-top: 1px solid var(--rv-line);
  margin-top: 17px;
  padding-top: 14px;
}
.rv-inspector h2 {
  font-size: 14px;
  font-weight: 650;
  margin: 0 0 9px;
}
.rv-motion {
  flex: none;
  border-top: 1px solid var(--rv-line);
  margin-top: 14px;
  padding-top: 12px;
}
.rv-motion summary {
  font-weight: 650;
}
.rv-motion summary::before {
  content: "▸ ";
  color: var(--rv-muted);
}
.rv-motion[open] summary::before {
  content: "▾ ";
}
.rv-motion-preference {
  margin: 8px 0;
  color: var(--rv-muted);
  font-size: 12px;
}
.rv-motion button,
.rv-check-dialog button {
  border: 1px solid var(--rv-line);
  border-radius: 6px;
  padding: 5px 9px;
  background: var(--rv-paper);
}
.rv-motion-output {
  display: block;
  margin-top: 8px;
  color: var(--rv-muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.rv-motion-output:empty {
  display: none;
}
.rv-check-frame {
  opacity: 0;
  pointer-events: none;
  z-index: -1;
}
.rv-check-dialog {
  --check-gutter: clamp(16px, 4vw, 24px);
  width: min(540px, calc(100vw - 24px));
  max-height: min(82dvh, 720px);
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--rv-line);
  border-radius: 16px;
  color: var(--rv-text);
  background: var(--rv-paper);
  box-shadow:
    0 24px 72px -18px #1517253b,
    0 4px 16px -5px #15172524;
}
.rv-check-dialog::backdrop {
  background: rgb(32 34 47 / 27%);
}
.rv-check-dialog[open] {
  display: flex;
  flex-direction: column;
}
.rv-check-head {
  display: flex;
  flex: none;
  align-items: center;
  gap: 12px;
  padding: 20px var(--check-gutter) 14px;
}
.rv-check-head h2 {
  margin: 0;
  font-size: 20px;
  line-height: 1.3;
  letter-spacing: -0.025em;
}
.rv-check-symbol {
  position: relative;
  display: grid;
  flex: none;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  color: var(--rv-accent);
  background: var(--rv-tint);
}
.rv-check-symbol::before {
  content: "";
  width: 10px;
  height: 12px;
  border-block: 2px solid;
  background: linear-gradient(currentColor, currentColor) left center / 8px 2px
    no-repeat;
  transform: translateX(3px);
}
.rv-check-symbol::after {
  content: "";
  position: absolute;
  top: calc(50% - 7px);
  left: calc(50% - 8px);
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: currentColor;
  box-shadow:
    0 6px currentColor,
    0 12px currentColor;
}
.rv-check-head .rv-check-close {
  width: 32px;
  height: 32px;
  margin-left: auto;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: var(--rv-panel);
  color: var(--rv-muted);
  font-size: 21px;
  line-height: 1;
}
.rv-check-close:hover {
  color: var(--rv-text);
}
.rv-check-summary {
  flex: none;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 0 var(--check-gutter) 16px;
  border-bottom: 1px solid var(--rv-line);
}
.rv-check-summary button {
  font-size: 12px;
}
.rv-check-status {
  margin: 0;
  color: var(--rv-muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.rv-check-progress {
  grid-column: 1 / -1;
  width: 100%;
  height: 4px;
  appearance: none;
  overflow: hidden;
  border: 0;
  border-radius: 2px;
  background: var(--rv-line);
}
.rv-check-progress::-webkit-progress-bar {
  background: var(--rv-line);
}
.rv-check-progress::-webkit-progress-value {
  background: var(--rv-accent);
}
.rv-check-progress::-moz-progress-bar {
  background: var(--rv-accent);
}
.rv-check-results {
  list-style: none;
  margin: 0;
  padding: 4px var(--check-gutter) 12px;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #c7c2b8 transparent;
}
.rv-check-row + .rv-check-row {
  border-top: 1px solid var(--rv-line);
}
.rv-check-entry summary {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 42px;
  padding: 6px 2px;
  list-style: none;
  cursor: pointer;
}
.rv-check-entry summary::-webkit-details-marker {
  display: none;
}
.rv-check-entry summary::after {
  content: "";
  width: 5px;
  height: 5px;
  border: solid var(--rv-muted);
  border-width: 0 1.5px 1.5px 0;
  margin: 0 4px;
  transform: rotate(-45deg);
}
.rv-check-entry[open] summary::after {
  transform: rotate(45deg);
}
.rv-check-entry strong {
  font-size: 13px;
  font-weight: 600;
}
.rv-check-outcome {
  margin-left: auto;
  color: var(--rv-muted);
  font-size: 12px;
}
.rv-check-indicator {
  display: grid;
  place-items: center;
  width: 19px;
  height: 19px;
  flex: none;
  border-radius: 50%;
  background: var(--rv-panel);
  font-size: 12px;
  line-height: 1;
}
.rv-check-row[data-result="pass"] .rv-check-indicator {
  background: #e9f3ed;
  color: #246044;
}
.rv-check-row[data-result="pass"] .rv-check-indicator::before {
  content: "✓";
}
.rv-check-row[data-result="fail"] .rv-check-indicator {
  background: #f9eae6;
  color: #9c3b29;
}
.rv-check-row[data-result="fail"] .rv-check-indicator::before {
  content: "!";
}
.rv-check-row p,
.rv-check-row small {
  display: block;
  margin: 0 0 10px 31px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--rv-muted);
  overflow-wrap: anywhere;
}
@media (pointer: coarse) {
  .rv-check-head .rv-check-close,
  .rv-check-entry summary {
    min-height: 44px;
  }
  .rv-check-head .rv-check-close {
    min-width: 44px;
  }
}
@media (prefers-reduced-motion: no-preference) {
  .rv-check-dialog[open] {
    animation: rv-dialog-enter 140ms ease-out;
  }
}
@keyframes rv-dialog-enter {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
}
.rv-states {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.rv-states button {
  font-size: 12px;
}
.rv-current {
  margin: 0 0 7px;
  color: var(--rv-muted);
  font-size: 12px;
}
.rv-preparation {
  margin: 0 0 8px;
  color: var(--rv-muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.rv-action-list {
  display: grid;
  gap: 4px;
}
.rv-action-list button {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  padding: 4px;
  text-align: left;
}
.rv-action-list button:hover:enabled,
.rv-tree button:hover {
  background: #eeede8;
}
.rv-number,
.rv-pin {
  background: #7654c4;
  color: white;
  border-radius: 50%;
  display: grid;
  place-items: center;
  width: 21px;
  height: 21px;
  padding: 0;
  font:
    600 11px/1 system-ui,
    sans-serif;
}
.rv-number {
  flex: none;
}
.rv-tree ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
@media (min-width: 761px) and (min-height: 540px) {
  .rv-inspector {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .rv-state-section,
  .rv-home {
    flex: none;
  }
  .rv-action-section {
    min-height: 65px;
    max-height: 40%;
    overflow: auto;
    scrollbar-width: thin;
    scrollbar-color: #c7c2b8 transparent;
  }
  .rv-tree-section {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 74px;
  }
  .rv-tree {
    min-height: 0;
    overflow: auto;
  }
}
.rv-tree ul ul {
  margin-inline-start: 11px;
  border-inline-start: 1px solid var(--rv-line);
  padding-inline-start: 8px;
}
.rv-tree-row {
  display: flex;
  align-items: center;
  gap: 2px;
}
.rv-tree button {
  border: 0;
  border-radius: 4px;
  background: transparent;
  padding: 4px 5px;
  text-align: left;
  font-size: 13px;
}
.rv-disclosure,
.rv-leaf {
  flex: 0 0 21px;
  min-height: 26px;
}
.rv-disclosure::before {
  content: "";
  display: block;
  width: 6px;
  height: 6px;
  margin: auto;
  border: solid var(--rv-muted);
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(-45deg);
}
.rv-disclosure[aria-expanded="true"]::before {
  transform: rotate(45deg);
}
.rv-tree .rv-jump {
  flex: 1;
  min-width: 0;
}
.rv-tree .rv-jump[aria-current="step"] {
  background: var(--rv-tint);
  color: var(--rv-accent);
  font-weight: 650;
}
.rv-tree-group + .rv-tree-group {
  margin-top: 8px;
}
.rv-tree-group > summary {
  cursor: pointer;
  color: var(--rv-muted);
  font-size: 12px;
  font-weight: 600;
  padding: 3px 0;
}
.rv-empty {
  margin: 0;
  font-size: 12px;
  color: var(--rv-muted);
}
.rv-error {
  color: #a23226;
  overflow-wrap: anywhere;
}
.rv-home {
  display: block;
  margin-top: 15px;
}
.rv-marks {
  pointer-events: none;
  overflow: hidden;
  z-index: 2;
}
.rv-outline {
  position: absolute;
  border: 1.5px dashed #7654c4;
  border-radius: 5px;
  pointer-events: none;
}
.rv-pin {
  position: absolute;
  top: var(--pin-top, -8px);
  right: var(--pin-right, -8px);
  box-shadow: 0 1px 4px #0003;
  border: 2px solid white;
  pointer-events: auto;
}
@media (max-width: 760px) {
  .rv-head {
    padding: 7px 10px;
  }
  .rv-body {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(210px, 55%) minmax(0, 1fr);
  }
  .rv-inspector {
    border-left: 0;
    border-top: 1px solid var(--rv-line);
    padding: 12px;
  }
}

      '[role="combobox"]',
      '[role="tab"]',
    ].join(",");
    const nodes = [...area.querySelectorAll(selector)];
    for (const node of nodes) {
      if (!visible(node, doc) || node.closest("[data-review-ignore]")) continue;
      if (typeof filter === "function" && !filter(node)) continue;
      if (items.some((item) => item.node === node || item.node.contains(node)))
        continue;
      const title = actionName(node);
      if (title) items.push({ action: { title, target: () => node }, node });
    }
  }
  function drawActions(items) {
    currentActions = items;
    actionSection.firstElementChild.textContent =
      t.actions + " · " + items.length;
    const key = JSON.stringify([
      selected,
      items.map((i) => [i.action.title, disabled(i.node)]),
    ]);
    if (key === lastActions) return;
    lastActions = key;
    actionList.replaceChildren();
    marks.replaceChildren();
    if (!items.length) actionList.append(el("p", "rv-empty", t.empty));
    for (const [index, { action, node }] of items.entries()) {
      const num = String(index + 1),
        label = t.action + " " + num + " · " + action.title;
      const row = button("", () => runAction(index)),
        pin = button(num, () => runAction(index), "rv-pin");
      row.append(el("span", "rv-number", num), el("span", "", action.title));
      row.disabled = pin.disabled = disabled(node);
      row.setAttribute("aria-label", label);
      pin.setAttribute("aria-label", label);
      pin.title = action.title;
      const box = el("div", "rv-outline");
      box.append(pin);
      marks.append(box);
      actionList.append(row);
    }
  }
  function align(items) {
    if (!marksToggle.checked || busy) {
      marks.hidden = true;
      return;
    }
    marks.hidden = false;
    const doc = frame.contentDocument,
      win = doc.defaultView;
    const width = frame.clientWidth,
      height = frame.clientHeight;
    for (const [index, { node }] of items.entries()) {
      const box = marks.children[index],
        rect = node.getBoundingClientRect();
      let left = Math.max(rect.left, 0),
        top = Math.max(rect.top, 0),
        right = Math.min(rect.right, width),
        bottom = Math.min(rect.bottom, height);
      for (
        let p = node.parentElement;
        p && p !== doc.body;
        p = p.parentElement
      ) {
        const style = win.getComputedStyle(p);
        const clipX = /auto|scroll|hidden|clip/.test(style.overflowX),
          clipY = /auto|scroll|hidden|clip/.test(style.overflowY);
        if (!clipX && !clipY) continue;
        const r = p.getBoundingClientRect();
        if (clipX) {
          left = Math.max(left, r.left + p.clientLeft);
          right = Math.min(right, r.left + p.clientLeft + p.clientWidth);
        }
        if (clipY) {
          top = Math.max(top, r.top + p.clientTop);
          bottom = Math.min(bottom, r.top + p.clientTop + p.clientHeight);
        }
      }
      box.hidden = right <= left || bottom <= top;
      if (box.hidden) continue;
      Object.assign(box.style, {
        left: left + "px",
        top: top + "px",
        width: right - left + "px",
        height: bottom - top + "px",
      });
      box.style.setProperty("--pin-top", top < 9 ? "0px" : "-8px");
      box.style.setProperty("--pin-right", right > width - 9 ? "0px" : "-8px");
    }
  }
  function refresh() {
    if (!scenario || busy) return;
    const state = detect();
    if ((state?.id || "") !== selected) drawState(state);
    const actions =
      typeof state?.actions === "function"
        ? state.actions()
        : state?.actions || [];
    const items = actions
      .map((action) => ({ action, node: target(action.target) }))
      .filter((item) => item.node);
    const discovery = state?.discoverActions ?? scenario.discoverActions;
    if (discovery) discoverActions(frame.contentDocument, items, discovery);
    drawActions(items);
    align(items);
    const next = new Set(items.map((i) => i.node));
    for (const node of watched)
      if (!next.has(node)) {
        tracker.unobserve(node);
        watched.delete(node);
      }
    for (const node of next)
      if (!watched.has(node)) {
        tracker.observe(node);
        watched.add(node);
      }
  }
  function enqueue(checkState) {
    needsState ||= checkState;
    if (!scheduled)
      scheduled = requestAnimationFrame(() => {
        scheduled = 0;
        const full = needsState;
        needsState = false;
        if (busy || !scenario) return;
        if (full) refresh();
        else align(currentActions);
      });
  }
  function schedule() {
    enqueue(true);
  }
  function scheduleLayout() {
    enqueue(false);
  }
  marksToggle.addEventListener("change", schedule);
  window.addEventListener("resize", schedule);
  function watch(doc, signal) {
    let mutationRefresh = 0;
    const observer = new MutationObserver((changes) => {
      if (
        marksToggle.checked &&
        changes.every(
          (change) =>
            change.type === "attributes" && change.attributeName === "style",
        )
      )
        scheduleLayout();
      if (!mutationRefresh)
        mutationRefresh = setTimeout(() => {
          mutationRefresh = 0;
          schedule();
        }, 60);
    });
    observer.observe(doc, {
      subtree: true,
      childList: true,
      attributes: true,
      characterData: true,
    });
    for (const type of [
      "input",
      "change",
      "transitionend",
      "animationend",
      "review-change",
    ])
      doc.addEventListener(type, schedule, { capture: true, signal });
    doc.addEventListener("scroll", scheduleLayout, { capture: true, signal });
    const motionQuery = doc.defaultView.matchMedia(
      "(prefers-reduced-motion: reduce)",
    );
    motionQuery.addEventListener(
      "change",
      () => {
        motionPreference.textContent = motionQuery.matches
          ? t.motionReduced
          : t.motionFull;
      },
      { signal },
    );
    tracker = new ResizeObserver(scheduleLayout);
    tracker.observe(frame);
    if (doc.fonts)
      doc.fonts.ready.then(() => {
        if (!signal.aborted) schedule();
      });
    signal.addEventListener(
      "abort",
      () => {
        observer.disconnect();
        tracker.disconnect();
        clearTimeout(mutationRefresh);
        watched.clear();
      },
      { once: true },
    );
  }
  function load(id) {
    if (motionRecording) finishMotion();
    controller?.abort();
    const next = new AbortController();
    controller = next;
    busy = true;
    scenario = undefined;
    orderedStates = [];
    selected = null;
    lastActions = "";
    currentActions = [];
    marks.hidden = true;
    loading.hidden = false;
    error.hidden = true;
    home.disabled = true;
    reset.disabled = true;
    checksButton.hidden = true;
    panel.setAttribute("aria-busy", "true");
    activeName.textContent = t.loading;
    preparation.hidden = true;
    variants.replaceChildren();
    actionList.replaceChildren();
    const nextFrame = el("iframe");
    nextFrame.title = t.preview;
    nextFrame.name = id ? "ui-review/" + id : "";
    nextFrame.addEventListener(
      "load",
      async () => {
        if (next.signal.aborted) return;
        const doc = nextFrame.contentDocument;
        try {
          if (!doc?.body) throw Error(t.preview);
          const definition = nextFrame.contentWindow.reviewScenario;
          validate(definition);
          scenario = definition;
          orderedStates = [...scenario.states].sort(
            (a, b) =>
              (b.priority || 0) - (a.priority || 0) || rank(b) - rank(a),
          );
          buildTree();
          reset.hidden = typeof scenario.reset !== "function";
          checksButton.hidden = scenario.checkIsolation !== true;
          dataLine.textContent =
            [
              ...new Set(
                [source.dataSource, scenario.dataSource].filter(Boolean),
              ),
            ].join(" · ") || t.unknown;
          preparation.textContent = scenario.preparation || "";
          preparation.hidden = !scenario.preparation;
          motionPreference.textContent = nextFrame.contentWindow.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches
            ? t.motionReduced
            : t.motionFull;
          const ui = makeDriver(doc, next.signal);
          const requested = id && scenario.states.find((s) => s.id === id);
          if (id && !requested) throw Error("Unknown state " + id);
          await requested?.enter?.(ui);
          await ui.wait(
            () => (requested ? detect()?.id === requested.id : detect()),
            requested?.title || t.preview,
          );
        } catch (e) {
          if (next.signal.aborted) return;
          report(e);
        }
        if (next.signal.aborted) return;
        if (scenario) watch(doc, next.signal);
        busy = false;
        loading.hidden = true;
        if (!scenario) {
          activeName.textContent = t.outside;
          reset.hidden = true;
        }
        home.disabled = !scenario?.entry;
        reset.disabled = false;
        panel.setAttribute("aria-busy", "false");
        if (scenario?.states) refresh();
      },
      { once: true },
    );
    nextFrame.srcdoc = config.appHtml;
    if (frame) frame.replaceWith(nextFrame);
    else stage.prepend(nextFrame);
    frame = nextFrame;
  }
  function toggleMotion() {
    if (motionRecording) {
      finishMotion();
      return;
    }
    const doc = frame.contentDocument;
    const controller = new AbortController();
    const events = new Map();
    const intervals = [];
    const recording = {
      controller,
      events,
      intervals,
      reduced: frame.contentWindow.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches,
      previous: null,
      frameId: 0,
      timer: 0,
    };
    for (const type of [
      "transitionrun",
      "transitionend",
      "transitioncancel",
      "animationstart",
      "animationend",
      "animationcancel",
    ]) {
      doc.addEventListener(
        type,
        (event) => {
          const name = event.propertyName || event.animationName || "";
          const key = name ? type + " · " + name : type;
          events.set(key, (events.get(key) || 0) + 1);
        },
        { capture: true, signal: controller.signal },
      );
    }
    function sample(now) {
      if (document.visibilityState === "visible") {
        if (recording.previous !== null)
          intervals.push(now - recording.previous);
        recording.previous = now;
      } else recording.previous = null;
      recording.frameId = requestAnimationFrame(sample);
    }
    recording.frameId = requestAnimationFrame(sample);
    recording.timer = setTimeout(finishMotion, 5000);
    motionRecording = recording;
    motionButton.textContent = t.motionStop;
    motionOutput.textContent = t.motionRunning;
  }
  function finishMotion() {
    const recording = motionRecording;
    if (!recording) return;
    motionRecording = undefined;
    recording.controller.abort();
    clearTimeout(recording.timer);
    cancelAnimationFrame(recording.frameId);
    motionButton.textContent = t.motionStart;
    const preference = recording.reduced ? t.motionReduced : t.motionFull;
    const eventText =
      [...recording.events]
        .map(([name, count]) => name + " × " + count)
        .join(", ") || "0";
    const frames = recording.intervals.length
      ? recording.intervals.length +
        (zh ? " 帧，最大 " : " frames, max ") +
        Math.max(...recording.intervals).toFixed(1) +
        " ms"
      : t.motionNoFrames;
    motionOutput.textContent =
      preference +
      " · " +
      t.motionEvents +
      ": " +
      eventText +
      " · " +
      t.motionFrames +
      ": " +
      frames;
  }
  async function checkState(state, signal) {
    const probe = el("iframe", "rv-check-frame");
    probe.title = t.checks + " · " + state.title;
    probe.name = "ui-review-check/" + state.id;
    probe.srcdoc = config.appHtml;
    const abort = () => probe.remove();
    signal.addEventListener("abort", abort, { once: true });
    try {
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => finish(reject, Error(t.loading)), 6000);
        function finish(callback, value) {
          clearTimeout(timer);
          signal.removeEventListener("abort", cancelled);
          callback(value);
        }
        function cancelled() {
          finish(reject, signal.reason);
        }
        signal.addEventListener("abort", cancelled, { once: true });
        probe.addEventListener("load", () => finish(resolve), { once: true });
        stage.append(probe);
      });
      signal.throwIfAborted();
      const doc = probe.contentDocument;
      const definition = probe.contentWindow.reviewScenario;
      validate(definition);
      if (definition.checkIsolation !== true) throw Error(t.missing);
      const requested = definition.states.find((item) => item.id === state.id);
      if (!requested) throw Error("Unknown state " + state.id);
      const ordered = [...definition.states].sort(
        (a, b) =>
          (b.priority || 0) - (a.priority || 0) ||
          rank(b, definition) - rank(a, definition),
      );
      const ui = makeDriver(doc, signal);
      await requested.enter?.(ui);
      await ui.wait(
        () => ordered.find((item) => item.match())?.id === state.id,
        requested.title,
      );
      const actions =
        typeof requested.actions === "function"
          ? requested.actions()
          : requested.actions || [];
      function inspectActions() {
        const items = [];
        const absent = [];
        const required = [];
        for (const action of actions) {
          const node = target(action.target, doc);
          if (node) items.push({ action, node });
          else {
            absent.push(action.title);
            if (!action.optional) required.push(action.title);
          }
        }
        const discovery =
          requested.discoverActions ?? definition.discoverActions;
        if (discovery) discoverActions(doc, items, discovery);
        const present = items.map(
          ({ action, node }) =>
            action.title +
            (disabled(node) ? (zh ? "（禁用）" : " (disabled)") : ""),
        );
        return { present, absent, required };
      }
      let result = inspectActions();
      try {
        await ui.wait(() => {
          result = inspectActions();
          return result.present.length && !result.required.length;
        }, t.missing);
      } catch (error) {
        if (signal.aborted) throw error;
        throw Error(
          t.missing + ": " + (result.required.join(" · ") || requested.title),
        );
      }
      return result;
    } finally {
      signal.removeEventListener("abort", abort);
      probe.remove();
    }
  }
  async function openChecks() {
    if (!scenario?.checkIsolation || checkController) return;
    const states = scenario.states.map(({ id, title }) => ({ id, title }));
    const controller = new AbortController();
    checkController = controller;
    checksList.replaceChildren();
    checksProgress.max = states.length;
    checksProgress.value = 0;
    checksStatus.textContent = t.checking + " 0 / " + states.length;
    stopChecks.hidden = false;
    checksDialog.showModal();
    let failures = 0;
    for (const [index, state] of states.entries()) {
      if (controller.signal.aborted) break;
      const row = el("li", "rv-check-row");
      const entry = el("details", "rv-check-entry");
      const summary = el("summary");
      const indicator = el("span", "rv-check-indicator");
      indicator.setAttribute("aria-hidden", "true");
      const outcome = el("span", "rv-check-outcome", t.checking);
      summary.append(indicator, el("strong", "", state.title), outcome);
      entry.append(summary);
      row.append(entry);
      checksList.append(row);
      try {
        const result = await checkState(state, controller.signal);
        entry.append(el("p", "", result.present.join(" · ")));
        if (result.absent.length)
          entry.append(
            el("small", "", t.unavailable + ": " + result.absent.join(" · ")),
          );
        row.dataset.result = "pass";
        outcome.textContent = t.passed;
      } catch (reason) {
        if (controller.signal.aborted) {
          outcome.textContent = t.stopped;
          break;
        }
        failures++;
        row.dataset.result = "fail";
        outcome.textContent = t.failed;
        entry.append(el("p", "", reason.message || String(reason)));
        entry.open = true;
      }
      checksProgress.value = index + 1;
      checksStatus.textContent =
        t.checking +
        " " +
        (index + 1) +
        " / " +
        states.length +
        (failures ? " · " + failures + (zh ? " 项失败" : " failed") : "");
    }
    checksStatus.textContent = controller.signal.aborted
      ? t.stopped
      : t.checked +
        " · " +
        (states.length - failures) +
        " / " +
        states.length +
        (failures ? " · " + failures + (zh ? " 项失败" : " failed") : "");
    stopChecks.hidden = true;
    checkController = undefined;
  }
  checksDialog.addEventListener("close", () => checkController?.abort());
  window.addEventListener("hashchange", () => {
    const state = new URLSearchParams(location.hash.slice(1)).get("state");
    if (state && state !== selected) load(state);
  });
  load(new URLSearchParams(location.hash.slice(1)).get("state") || "");
})();
</script></body></html>
