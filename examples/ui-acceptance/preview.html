<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'self' about:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"><meta name="showai-source-revision" content=""><title>UI review</title><style>:root {
  color-scheme: light;

* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--rv-paper);
}
button,
input {
  font: inherit;
}
button {
  color: inherit;
  cursor: pointer;
}
button:disabled {
  opacity: 0.48;
  cursor: default;
}
:focus-visible {
  outline: 2px solid var(--rv-accent);
  outline-offset: 2px;
}
[hidden] {
  display: none !important;
}
.rv-shell {
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
}
.rv-head {
  min-height: 52px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 16px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--rv-line);
  background: var(--rv-panel);
}
.rv-head h1 {
  flex: 1;
  min-width: max-content;
  margin: 0;
  font-size: 16px;
  font-weight: 650;
}
.rv-tools,
.rv-tools label {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.rv-tools {
  gap: 7px 12px;
  font-size: 13px;
}
.rv-tools input {
  margin: 0;
  accent-color: var(--rv-accent);
}
.rv-tools button,
.rv-states button,
.rv-home {
  background: var(--rv-paper);
  border: 1px solid var(--rv-line);
  border-radius: 6px;
  padding: 5px 9px;
}
.rv-tools button[aria-expanded="true"],
.rv-states button[aria-pressed="true"] {
  border-color: #c5b4e5;
  color: var(--rv-accent);
  background: var(--rv-tint);
}
.rv-body {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 294px;
}
.rv-stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.rv-stage iframe,
.rv-marks,
.rv-loading {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.rv-loading {
  z-index: 3;
  display: grid;
  place-items: center;
  background: var(--rv-panel);
  color: var(--rv-muted);
}
.rv-inspector {
  min-height: 0;
  overflow: auto;
  padding: 16px;
  background: var(--rv-panel);
  border-left: 1px solid var(--rv-line);
}
.rv-inspector section + section {
  border-top: 1px solid var(--rv-line);
  margin-top: 17px;
  padding-top: 14px;
}
.rv-inspector h2 {
  font-size: 14px;
  font-weight: 650;
  margin: 0 0 9px;
}
.rv-states {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.rv-states button {
  font-size: 12px;
}
.rv-current {
  margin: 0 0 7px;
  color: var(--rv-muted);
  font-size: 12px;
}
.rv-action-list {
  display: grid;
  gap: 4px;
}
.rv-action-list button {

  align-items: center;
  gap: 8px;
  min-height: 34px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  padding: 4px;
  text-align: left;
}
.rv-action-list button:hover:enabled,
.rv-tree button:hover {
  background: #eeede8;
}
.rv-number,
.rv-pin {
  background: #7654c4;
  color: white;
  border-radius: 50%;
  display: grid;
  place-items: center;
  width: 21px;
  height: 21px;
  padding: 0;
  font:
    600 11px/1 system-ui,
    sans-serif;
}
.rv-number {
  flex: none;
}
.rv-tree ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
@media (min-width: 761px) and (min-height: 540px) {
  .rv-inspector {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .rv-state-section,
  .rv-home {
    flex: none;
  }
  .rv-action-section {
    min-height: 65px;
    max-height: 40%;
    overflow: auto;
  }
  .rv-tree-section {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 74px;
  }
  .rv-tree {
    min-height: 0;
    overflow: auto;
  }
}
.rv-tree ul ul {
  margin-inline-start: 11px;
  border-inline-start: 1px solid var(--rv-line);
  padding-inline-start: 8px;
}
.rv-tree-row {
  display: flex;
  align-items: center;
  gap: 2px;
}
.rv-tree button {
  border: 0;
  border-radius: 4px;
  background: transparent;
  padding: 4px 5px;
  text-align: left;
  font-size: 13px;
}
.rv-disclosure,
.rv-leaf {
  flex: 0 0 21px;
  min-height: 26px;
}
.rv-disclosure::before {
  content: "";
  display: block;
  width: 6px;
  height: 6px;
  margin: auto;
  border: solid var(--rv-muted);
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(-45deg);
}
.rv-disclosure[aria-expanded="true"]::before {
  transform: rotate(45deg);
}
.rv-tree .rv-jump {
  flex: 1;
  min-width: 0;
}
.rv-tree .rv-jump[aria-current="step"] {
  background: var(--rv-tint);
  color: var(--rv-accent);
  font-weight: 650;
}
.rv-tree-group + .rv-tree-group {
  margin-top: 8px;
}
.rv-tree-group > summary {
  cursor: pointer;
  color: var(--rv-muted);
  font-size: 12px;
  font-weight: 600;
  padding: 3px 0;
}
.rv-empty {
  margin: 0;
  font-size: 12px;
  color: var(--rv-muted);
}
.rv-error {
  color: #a23226;
  overflow-wrap: anywhere;
}
.rv-home {
  display: block;
  margin-top: 15px;
}
.rv-marks {
  pointer-events: none;
  overflow: hidden;
  z-index: 2;
}
.rv-outline {
  position: absolute;
  border: 1.5px dashed #7654c4;
  border-radius: 5px;
  pointer-events: none;
}
.rv-pin {
  position: absolute;
  top: var(--pin-top, -8px);
  right: var(--pin-right, -8px);
  box-shadow: 0 1px 4px #0003;
  border: 2px solid white;
  pointer-events: auto;
}
@media (max-width: 760px) {
  .rv-head {
    padding: 7px 10px;
  }
  .rv-body {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(210px, 55%) minmax(0, 1fr);
  }
  .rv-inspector {
    border-left: 0;
    border-top: 1px solid var(--rv-line);
    padding: 12px;
  }
}

live=\"polite\">\u003c/output>\n      \u003c/footer>\n    \u003c/main>\n    \u003cscript>\n      const chinese = navigator.language.toLowerCase().startsWith(\"zh\");\n      const copy = chinese\n        ? {\n            heading: \"页面搜索 · 模拟目录\",\n            label: \"搜索页面\",\n            clear: \"清空\",\n            check: \"检查示例\",\n            empty: \"没有匹配的页面\",\n            pages: [\"研究计划\", \"访谈提纲\", \"访谈记录\"],\n            query: \"访谈\",\n            expected: [\"访谈提纲\", \"访谈记录\"],\n            cases: [\"筛选\", \"空结果\", \"清空\"],\n            passed: \"3 项检查通过\",\n            failed: \"失败：\",\n          }\n        : {\n            heading: \"Page search · mock directory\",\n            label: \"Search pages\",\n            clear: \"Clear\",\n            check: \"Check example\",\n            empty: \"No matching pages\",\n            pages: [\"Research plan\", \"Interview guide\", \"Interview notes\"],\n            query: \"interview\",\n            expected: [\"Interview guide\", \"Interview notes\"],\n            cases: [\"Filter\", \"Empty results\", \"Clear\"],\n            passed: \"3 checks passed\",\n            failed: \"Failed: \",\n          };\n      document.documentElement.lang = chinese ? \"zh-CN\" : \"en\";\n      document.title = copy.heading;\n      for (const id of [\"heading\", \"label\", \"clear\", \"check\", \"empty\"]) {\n        document.getElementById(id).textContent = copy[id];\n      }\n      const form = document.querySelector(\"form\");\n      const search = document.getElementById(\"search\");\n      const list = document.getElementById(\"pages\");\n      const empty = document.getElementById(\"empty\");\n      const check = document.getElementById(\"check\");\n      const result = document.getElementById(\"result\");\n\n      function render() {\n        const query = search.value.trim().toLowerCase();\n        const matches = copy.pages.filter((title) =>\n          title.toLowerCase().includes(query),\n        );\n        list.replaceChildren(\n          ...matches.map((title) => {\n            const row = document.createElement(\"li\");\n            row.textContent = title;\n            return row;\n          }),\n        );\n        empty.hidden = matches.length > 0;\n      }\n      search.addEventListener(\"input\", render);\n      form.addEventListener(\"submit\", (event) => event.preventDefault());\n      form.addEventListener(\"reset\", (event) => {\n        event.preventDefault();\n        search.value = \"\";\n        render();\n        search.focus();\n      });\n      search.addEventListener(\"keydown\", (event) => {\n        if (event.key === \"Escape\" && !event.isComposing) {\n          event.preventDefault();\n          form.reset();\n        }\n      });\n\n      function enter(value) {\n        search.value = value;\n        search.dispatchEvent(new Event(\"input\", { bubbles: true }));\n      }\n      function checkView(name, query, pages) {\n        const expected = { query, pages, empty: pages.length === 0 };\n        const actual = {\n          query: search.value,\n          pages: Array.from(list.children, (row) => row.textContent),\n          empty: !empty.hidden,\n        };\n        if (JSON.stringify(actual) === JSON.stringify(expected)) return \"\";\n        return name + \" \" + JSON.stringify({ expected, actual });\n      }\n      check.addEventListener(\"click\", () => {\n        const previous = search.value;\n        enter(copy.query);\n        const filtered = checkView(copy.cases[0], copy.query, copy.expected);\n        enter(\"no-match-404\");\n        const noMatches = checkView(copy.cases[1], \"no-match-404\", []);\n        document.getElementById(\"clear\").click();\n        const cleared = checkView(copy.cases[2], \"\", copy.pages);\n        enter(previous);\n        check.focus();\n        const failed = [filtered, noMatches, cleared].filter(Boolean);\n        result.textContent = failed.length\n          ? copy.failed + failed.join(\", \")\n          :               "",
              () => {
                nested.hidden = !nested.hidden;
                toggle.setAttribute("aria-expanded", String(!nested.hidden));
              },
              "rv-disclosure",
            );
          nested.hidden = !!state.parent;
          toggle.setAttribute("aria-label", t.branch + " " + state.title);
          toggle.setAttribute("aria-expanded", String(!nested.hidden));
          branches.set(state.id, { nested, toggle });
          row.append(toggle);
          li.append(nested);
        } else row.append(el("span", "rv-leaf"));
        row.append(jump);
        ul.append(li);
      }
      return ul;
    }
    const roots = scenario.states.filter((s) => !s.parent);
    for (const group of new Set(roots.map((s) => s.group || ""))) {
      const items = list(roots.filter((s) => (s.group || "") === group));
      if (!group) {
        tree.append(items);
        continue;
      }
      const details = el("details", "rv-tree-group");
      details.open = true;
      details.append(el("summary", "", group), items);
      tree.append(details);
    }
  }
  function rank(state) {
    let depth = 0,
      parent = state.parent;
    while (parent) {
      depth++;
      parent = scenario.states.find((s) => s.id === parent).parent;
    }
    return depth;
  }
  function detect() {
    return orderedStates.find((state) => state.match());
  }
  function drawState(state) {
    selected = state?.id || "";
    panel.dataset.state = selected;
    activeName.textContent = state?.title || t.outside;
    variants.replaceChildren();
    const visibleStates = state?.variants
      ? state.variants
          .map((id) => scenario.states.find((s) => s.id === id))
          .filter(Boolean)
      : scenario.states.filter(
          (s) => s.parent === state?.parent && s.group === state?.group,
        );
    if (state && !visibleStates.includes(state)) visibleStates.unshift(state);
    for (const option of visibleStates) {
      const node = button(option.title, () => load(option.id));
      node.setAttribute("aria-pressed", String(option === state));
      variants.append(node);
    }
    for (const [id, item] of jumpButtons) {
      if (id === selected) item.setAttribute("aria-current", "step");
      else item.removeAttribute("aria-current");
    }
    for (
      let parent = state?.parent;
      parent;
      parent = scenario.states.find((s) => s.id === parent).parent
    ) {
      const branch = branches.get(parent);
      if (branch) {
        branch.nested.hidden = false;
        branch.toggle.setAttribute("aria-expanded", "true");
      }
    }
    const group = jumpButtons.get(selected)?.closest("details");
    if (group) group.open = true;
  }
  function runAction(index) {
    if (busy || !scenario) return;
    const state = detect();
    if (state?.id !== selected) {
      refresh();
      return;
    }
    const item = currentActions[index];
    if (item) {
      const node = target(item.action.target);
      if (node) activate(node);
    }
  }
  function drawActions(items) {
    currentActions = items;
    const key = JSON.stringify([
      selected,
      items.map((i) => [i.action.title, disabled(i.node)]),
    ]);
    if (key === lastActions) return;
    lastActions = key;
    actionList.replaceChildren();
    marks.replaceChildren();
    if (!items.length) actionList.append(el("p", "rv-empty", t.empty));
    for (const [index, { action, node }] of items.entries()) {
      const num = String(index + 1),
        label = t.action + " " + num + " · " + action.title;
      const row = button("", () => runAction(index)),
        pin = button(num, () => runAction(index), "rv-pin");
      row.append(el("span", "rv-number", num), el("span", "", action.title));
      row.disabled = pin.disabled = disabled(node);
      row.setAttribute("aria-label", label);
      pin.setAttribute("aria-label", label);
      pin.title = action.title;
      const box = el("div", "rv-outline");
      box.append(pin);
      marks.append(box);
      actionList.append(row);
    }
  }
  function align(items) {
    if (!marksToggle.checked || busy) {
      marks.hidden = true;
      return;
    }
    marks.hidden = false;
    const doc = frame.contentDocument,
      win = doc.defaultView;
    const width = frame.clientWidth,
      height = frame.clientHeight;
    for (const [index, { node }] of items.entries()) {
      const box = marks.children[index],
        rect = node.getBoundingClientRect();
      let left = Math.max(rect.left, 0),
        top = Math.max(rect.top, 0),
        right = Math.min(rect.right, width),
        bottom = Math.min(rect.bottom, height);
      for (
        let p = node.parentElement;
        p && p !== doc.body;
        p = p.parentElement
      ) {
        const style = win.getComputedStyle(p);
        const clipX = /auto|scroll|hidden|clip/.test(style.overflowX),
          clipY = /auto|scroll|hidden|clip/.test(style.overflowY);
        if (!clipX && !clipY) continue;
        const r = p.getBoundingClientRect();
        if (clipX) {
          left = Math.max(left, r.left + p.clientLeft);
          right = Math.min(right, r.left + p.clientLeft + p.clientWidth);
        }
        if (clipY) {
          top = Math.max(top, r.top + p.clientTop);
          bottom = Math.min(bottom, r.top + p.clientTop + p.clientHeight);
        }
      }
      box.hidden = right <= left || bottom <= top;
      if (box.hidden) continue;
      Object.assign(box.style, {
        left: left + "px",
        top: top + "px",
        width: right - left + "px",
        height: bottom - top + "px",
      });
      box.style.setProperty("--pin-top", top < 9 ? "0px" : "-8px");
      box.style.setProperty("--pin-right", right > width - 9 ? "0px" : "-8px");
    }
  }
  function refresh() {
    if (!scenario || busy) return;
    const state = detect();
    if ((state?.id || "") !== selected) drawState(state);
    const actions =
      typeof state?.actions === "function"
        ? state.actions()
        : state?.actions || [];
    const items = actions
      .map((action) => ({ action, node: target(action.target) }))
      .filter((item) => item.node);
    drawActions(items);
    align(items);
    const next = new Set(items.map((i) => i.node));
    for (const node of watched)
      if (!next.has(node)) {
        tracker.unobserve(node);
        watched.delete(node);
      }
    for (const node of next)
      if (!watched.has(node)) {
        tracker.observe(node);
        watched.add(node);
      }
  }
  function enqueue(checkState) {
    needsState ||= checkState;
    if (!scheduled)
      scheduled = requestAnimationFrame(() => {
        scheduled = 0;
        const full = needsState;
        needsState = false;
        if (busy || !scenario) return;
        if (full) refresh();
        else align(currentActions);
      });
  }
  function schedule() {
    enqueue(true);
  }
  function scheduleLayout() {
    enqueue(false);
  }
  marksToggle.addEventListener("change", schedule);
  window.addEventListener("resize", schedule);
  function watch(doc, signal) {
    const observer = new MutationObserver(schedule);
    observer.observe(doc, {
      subtree: true,
      childList: true,
      attributes: true,
      characterData: true,
    });
    for (const type of [
      "input",
      "change",
      "transitionend",
      "animationend",
      "review-change",
    ])
      doc.addEventListener(type, schedule, { capture: true, signal });
    doc.addEventListener("scroll", scheduleLayout, { capture: true, signal });
    tracker = new ResizeObserver(scheduleLayout);
    tracker.observe(frame);
    if (doc.fonts)
      doc.fonts.ready.then(() => {
        if (!signal.aborted) schedule();
      });
    signal.addEventListener(
      "abort",
      () => {
        observer.disconnect();
        tracker.disconnect();
        watched.clear();
      },
      { once: true },
    );
  }
  function load(id) {
    controller?.abort();
    const next = new AbortController();
    controller = next;
    busy = true;
    scenario = undefined;
    orderedStates = [];
    selected = null;
    lastActions = "";
    currentActions = [];
    marks.hidden = true;
    loading.hidden = false;
    error.hidden = true;
    home.disabled = true;
    reset.disabled = true;
    panel.setAttribute("aria-busy", "true");
    activeName.textContent = t.loading;
    variants.replaceChildren();
    actionList.replaceChildren();
    const nextFrame = el("iframe");
    nextFrame.title = t.preview;
    nextFrame.name = id ? "ui-review/" + id : "";
    nextFrame.addEventListener(
      "load",
      async () => {
        if (next.signal.aborted) return;
        const doc = nextFrame.contentDocument;
        try {
          if (!doc?.body) throw Error(t.preview);
          const definition = nextFrame.contentWindow.reviewScenario;
          validate(definition);
          scenario = definition;
          orderedStates = [...scenario.states].sort(
            (a, b) =>
              (b.priority || 0) - (a.priority || 0) || rank(b) - rank(a),
          );
          buildTree();
          reset.hidden = typeof scenario.reset !== "function";
          const ui = makeDriver(doc, next.signal);
          const requested = id && scenario.states.find((s) => s.id === id);
          if (id && !requested) throw Error("Unknown state " + id);
          await requested?.enter?.(ui);
          await ui.wait(
            () => (requested ? detect()?.id === requested.id : detect()),
            requested?.title || t.preview,
          );
        } catch (e) {
          if (next.signal.aborted) return;
          report(e);
        }
        if (next.signal.aborted) return;
        if (scenario) watch(doc, next.signal);
        busy = false;
        loading.hidden = true;
        if (!scenario) {
          activeName.textContent = t.outside;
          reset.hidden = true;
        }
        home.disabled = !scenario?.entry;
        reset.disabled = false;
        panel.setAttribute("aria-busy", "false");
        if (scenario?.states) refresh();
      },
      { once: true },
    );
    nextFrame.srcdoc = config.appHtml;
    if (frame) frame.replaceWith(nextFrame);
    else stage.prepend(nextFrame);
    frame = nextFrame;
  }
  load("");
})();
</script></body></html>
