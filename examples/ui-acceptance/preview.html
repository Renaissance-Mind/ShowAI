bel>\n      \u003cform role=\"search\">\n        \u003cinput type=\"search\" id=\"search\" autocomplete=\"off\" />\n        \u003cbutton type=\"reset\" id=\"clear\">\u003c/button>\n      \u003c/form>\n      \u003cul id=\"pages\">\u003c/ul>\n      \u003cp id=\"empty\" role=\"status\" hidden>\u003c/p>\n      \u003cfooter>\n        \u003cbutton type=\"button\" id=\"check\">\u003c/button>\n        \u003coutput id=\"result\" aria-live=\"polite\">\u003c/output>\n      \u003c/footer>\n    \u003c/main>\n    \u003cscript>\n      const chinese = (\n        window.frameElement?.ownerDocument.documentElement.lang ||\n        navigator.language\n      )\n        .toLowerCase()\n        .startsWith(\"zh\");\n      const copy = chinese\n        ? {\n            heading: \"页面搜索 · 模拟目录\",\n            label: \"搜索页面\",\n            clear: \"清空\",\n            check: \"检查示例\",\n            empty: \"没有匹配的页面\",\n            pages: [\"研究计划\", \"访谈提纲\", \"访谈记录\"],\n            query: \"访谈\",\n            expected: [\"访谈提纲\", \"访谈记录\"],\n            cases: [\"筛选\", \"空结果\", \"清空\"],\n            passed: \"3 项检查通过\",\n            failed: \"失败：\",\n          }\n        : {\n            heading: \"Page search · mock directory\",\n            label: \"Search pages\",\n            clear: \"Clear\",\n            check: \"Check example\",\n            empty: \"No matching pages\",\n            pages: [\"Research plan\", \"Interview guide\", \"Interview notes\"],\n            query: \"interview\",\n            expected: [\"Interview guide\", \"Interview notes\"],\n            cases: [\"Filter\", \"Empty results\", \"Clear\"],\n            passed: \"3 checks passed\",\n            failed: \"Failed: \",\n          };\n      document.documentElement.lang = chinese ? \"zh-CN\" : \"en\";\n      document.title = copy.heading;\n      for (const id of [\"heading\", \"label\", \"clear\", \"check\", \"empty\"]) {\n        document.getElementById(id).textContent = copy[id];\n      }\n      const form = document.querySelector(\"form\");\n      const search = document.getElementById(\"search\");\n      const list = document.getElementById(\"pages\");\n      const empty = document.getElementById(\"empty\");\n      const check = document.getElementById(\"check\");\n      const result = document.getElementById(\"result\");\n\n      function render() {\n        const query = search.value.trim().toLowerCase();\n        const matches = copy.pages.filter((title) =>\n          title.toLowerCase().includes(query),\n        );\n        list.replaceChildren(\n          ...matches.map((title) => {\n            const row = document.createElement(\"li\");\n            row.textContent = title;\n            return row;\n          }),\n        );\n        empty.hidden = matches.length > 0;\n      }\n      search.addEventListener(\"input\", render);\n      form.addEventListener(\"submit\", (event) => event.preventDefault());\n      form.addEventListener(\"reset\", (event) => {\n        event.preventDefault();\n        search.value = \"\";\n        render();\n        search.focus();\n      });\n      search.addEventListener(\"keydown\", (event) => {\n        if (event.key === \"Escape\" && !event.isComposing) {\n          event.preventDefault();\n          form.reset();\n        }\n      });\n\n      function enter(value) {\n        search.value = value;\n        search.dispatchEvent(new Event(\"input\", { bubbles: true }));\n      }\n      function checkView(name, query, pages) {\n        const expected = { query, pages, empty: pages.length === 0 };\n        const actual = {\n          query: search.value,\n          pages: Array.from(list.children, (row) => row.textContent),\n          empty: !empty.hidden,\n        };\n        if (JSON.stringify(actual) === JSON.stringify(expected)) return \"\";\n        return name + \" \" + JSON.stringify({ expected, actual });\n      }\n      check.addEventListener(\"click\", () => {\n        const previous = search.value;\n        enter(copy.query);\n        const filtered = checkView(copy.cases[0], copy.query, copy.expected);\n        enter(\"no-match-404\");\n        const noMatches = checkView(copy.cases[1], \"no-match-404\", []);\n        document.getElementById(\"clear\").click();\n        const cleared = checkView(copy.cases[2], \"\", copy.pages);\n        enter(previous);\n        check.focus();\n        const failed = [filtered, noMatches, cleared].filter(Boolean);\n        result.textContent = failed.length\n          ? copy.failed + failed.join(\", \")\n          : copy.passed;\n      });\n      render();\n      const stateIds = [\"all\", \"matches\", \"empty\"];\n      const actions = [\n        { title: copy.label, target: \"#search\" },\n        { title: copy.clear, target: \"#clear\" },\n        { title: copy.check, target: \"#check\" },\n      ];\n      const titles = chinese\n        ? [\"全部页面\", \"有匹配结果\", \"没有匹配结果\"]\n        : [\"All pages\", \"Matching pages\", \"Empty results\"];\n      const queries = [\"\", copy.query, \"no-match-404\"];\n      const currentState = () =>\n        !search.value.trim()\n          ? \"all\"\n          : list.children.length\n            ? \"matches\"\n            : \"empty\";\n      window.reviewScenario = {\n        entry: \"all\",\n        checkIsolation: true,\n        dataSource: chinese ? \"静态示例页面\" : \"Static example pages\",\n        transitions: [\n          {\n            from: \"all\",\n            to: \"matches\",\n            label: chinese ? \"输入匹配关键词\" : \"Enter a match\",\n          },\n          {\n            from: \"all\",\n            to: \"empty\",\n            label: chinese ? \"输入不匹配关键词\" : \"Enter a non-match\",\n          },\n          { from: \"matches\", to: \"all\", label: copy.clear, kind: \"back\" },\n          { from: \"empty\", to: \"all\", label: copy.clear, kind: \"back\" },\n        ],\n        states: stateIds.map((id, i) => ({\n          id,\n          title: titles[i],\n          parent: i ? \"all\" : undefined,\n          match: () => currentState() === id,\n          enter: (ui) => ui.fill(\"#search\", queries[i], copy.label),\n          variants: stateIds,\n          actions,\n        })),\n      };\n    \u003c/script>\n  \u003c/body>\n\u003c/html>\n","title":"独立界面验收","lang":"zh-CN","metadata":{"dataSource":"静态示例页面","revision":"","contentHash":"e4cf61d98904c3e987fcf013ee7d1ee744693e29ea9fd110bdb3ba076fd6ede7"},"flow":{"width":960,"height":614,"nodes":[{"id":"all","title":"全部页面","x":44,"y":189,"width":300,"height":236,"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAL4BLADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAQGAwUHAggB/8QAUBABAAEDAgMCDAIIAwMHDQEAAAECAwQFEQYSIRQxBxMVIkFRU1WSlNLTYXQWMjVUcYGysyNCkSQ0cjY3UlZ2gqEIFzNDV2JkdZOWsbTR4v/EABQBAQAAAAAAAAAAAAAAAAAAAAD/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIRAxEAPwDuIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA   }
  function refresh() {
    if (!scenario || busy) return;
    const state = detect();
    if ((state?.id || "") !== selected) drawState(state);
    const actions =
      typeof state?.actions === "function"
        ? state.actions()
        : state?.actions || [];
    const items = actions
      .map((action) => ({ action, node: target(action.target) }))
      .filter((item) => item.node);
    const discovery = state?.discoverActions ?? scenario.discoverActions;
    if (discovery) discoverActions(frame.contentDocument, items, discovery);
    drawActions(items);
    align(items);
    const next = new Set(items.map((i) => i.node));
    for (const node of watched)
      if (!next.has(node)) {
        tracker.unobserve(node);
        watched.delete(node);
      }
    for (const node of next)
      if (!watched.has(node)) {
        tracker.observe(node);
        watched.add(node);
      }
  }
  function enqueue(checkState) {
    needsState ||= checkState;
    if (!scheduled)
      scheduled = requestAnimationFrame(() => {
        scheduled = 0;
        const full = needsState;
        needsState = false;
        if (busy || !scenario) return;
        if (full) refresh();
        else align(currentActions);
      });
  }
  function schedule() {
    enqueue(true);
  }
  function scheduleLayout() {
    enqueue(false);
  }
  marksToggle.addEventListener("change", schedule);
  window.addEventListener("resize", schedule);
  function watch(doc, signal) {
    let mutationRefresh = 0;
    const observer = new MutationObserver((changes) => {
      if (
        marksToggle.checked &&
        changes.every(
          (change) =>
            change.type === "attributes" && change.attributeName === "style",
        )
      )
        scheduleLayout();
      if (!mutationRefresh)
        mutationRefresh = setTimeout(() => {
          mutationRefresh = 0;
          schedule();
        }, 60);
    });
    observer.observe(doc, {
      subtree: true,
      childList: true,
      attributes: true,
      characterData: true,
    });
    for (const type of [
      "input",
      "change",
      "transitionend",
      "animationend",
      "review-change",
    ])
      doc.addEventListener(type, schedule, { capture: true, signal });
    doc.addEventListener("scroll", scheduleLayout, { capture: true, signal });
    const motionQuery = doc.defaultView.matchMedia(
      "(prefers-reduced-motion: reduce)",
    );
    motionQuery.addEventListener(
      "change",
      () => {
        motionPreference.textContent = motionQuery.matches
          ? t.motionReduced
          : t.motionFull;
      },
      { signal },
    );
    tracker = new ResizeObserver(scheduleLayout);
    tracker.observe(frame);
    if (doc.fonts)
      doc.fonts.ready.then(() => {
        if (!signal.aborted) schedule();
      });
    signal.addEventListener(
      "abort",
      () => {
        observer.disconnect();
        tracker.disconnect();
        clearTimeout(mutationRefresh);
        watched.clear();
      },
      { once: true },
    );
  }
  function load(id) {
    if (motionRecording) finishMotion();
    controller?.abort();
    const next = new AbortController();
    controller = next;
    busy = true;
    scenario = undefined;
    orderedStates = [];
    selected = null;
    lastActions = "";
    currentActions = [];
    marks.hidden = true;
    loading.hidden = false;
    error.hidden = true;
    home.disabled = true;
    reset.disabled = true;
    checksButton.hidden = true;
    if (flowToggle) flowToggle.disabled = true;
    panel.setAttribute("aria-busy", "true");
    activeName.textContent = t.loading;
    preparation.hidden = true;
    variants.replaceChildren();
    actionList.replaceChildren();
    const nextFrame = el("iframe");
    nextFrame.title = t.preview;
    nextFrame.name = capture
      ? "ui-review-check/" + id
      : id
        ? "ui-review/" + id
        : "";
    nextFrame.addEventListener(
      "load",
      async () => {
        if (next.signal.aborted) return;
        const doc = nextFrame.contentDocument;
        try {
          if (!doc?.body) throw Error(t.preview);
          const definition = nextFrame.contentWindow.reviewScenario;
          validate(definition);
          if (capture && definition.checkIsolation !== true)
            throw Error(
              "Capturing thumbnails requires an isolated review scenario (checkIsolation).",
            );
          scenario = definition;
          orderedStates = [...scenario.states].sort(
            (a, b) =>
              (b.priority || 0) - (a.priority || 0) || rank(b) - rank(a),
          );
          buildTree();
          reset.hidden = typeof scenario.reset !== "function";
          checksButton.hidden = scenario.checkIsolation !== true;
          dataLine.textContent =
            [
              ...new Set(
                [source.dataSource, scenario.dataSource].filter(Boolean),
              ),
            ].join(" · ") || t.unknown;
          preparation.textContent = scenario.preparation || "";
          preparation.hidden = !scenario.preparation;
          motionPreference.textContent = nextFrame.contentWindow.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches
            ? t.motionReduced
            : t.motionFull;
          const ui = makeDriver(doc, next.signal);
          const requested = id && scenario.states.find((s) => s.id === id);
          if (id && !requested) throw Error("Unknown state " + id);
          await requested?.enter?.(ui);
          await ui.wait(
            () => (requested ? detect()?.id === requested.id : detect()),
            requested?.title || t.preview,
          );
        } catch (e) {
          if (next.signal.aborted) return;
          report(e);
        }
        if (next.signal.aborted) return;
        if (scenario) watch(doc, next.signal);
        busy = false;
        loading.hidden = true;
        if (!scenario) {
          activeName.textContent = t.outside;
          reset.hidden = true;
        }
        home.disabled = !scenario?.entry;
        reset.disabled = false;
        if (flowToggle) flowToggle.disabled = !scenario;
        panel.setAttribute("aria-busy", "false");
        if (scenario?.states) {
          refresh();
          if (flowToggle && openFlowOnLoad && !capture) {
            openFlowOnLoad = false;
            flowToggle.click();
          }
        }
      },
      { once: true },
    );
    nextFrame.srcdoc = config.appHtml;
    if (frame) frame.replaceWith(nextFrame);
    else stage.prepend(nextFrame);
    frame = nextFrame;
  }
  function toggleMotion() {
    if (motionRecording) {
      finishMotion();
      return;
    }
    const doc = frame.contentDocument;
    const controller = new AbortController();
    const events = new Map();
    const intervals = [];
    const recording = {
      controller,
      events,
      intervals,
      reduced: frame.contentWindow.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches,
      previous: null,
      frameId: 0,
      timer: 0,
    };
    for (const type of [
      "transitionrun",
      "transitionend",
      "transitioncancel",
      "animationstart",
      "animationend",
      "animationcancel",
    ]) {
      doc.addEventListener(
        type,
        (event) => {
          const name = event.propertyName || event.animationName || "";
          const key = name ? type + " · " + name : type;
          events.set(key, (events.get(key) || 0) + 1);
        },
        { capture: true, signal: controller.signal },
      );
    }
    function sample(now) {
      if (document.visibilityState === "visible") {
        if (recording.previous !== null)
          intervals.push(now - recording.previous);
        recording.previous = now;
      } else recording.previous = null;
      recording.frameId = requestAnimationFrame(sample);
    }
    recording.frameId = requestAnimationFrame(sample);
    recording.timer = setTimeout(finishMotion, 5000);
    motionRecording = recording;
    motionButton.textContent = t.motionStop;
    motionOutput.textContent = t.motionRunning;
  }
  function finishMotion() {
    const recording = motionRecording;
    if (!recording) return;
    motionRecording = undefined;
    recording.controller.abort();
    clearTimeout(recording.timer);
    cancelAnimationFrame(recording.frameId);
    motionButton.textContent = t.motionStart;
    const preference = recording.reduced ? t.motionReduced : t.motionFull;
    const eventText =
      [...recording.events]
        .map(([name, count]) => name + " × " + count)
        .join(", ") || "0";
    const frames = recording.intervals.length
      ? recording.intervals.length +
        (zh ? " 帧，最大 " : " frames, max ") +
        Math.max(...recording.intervals).toFixed(1) +
        " ms"
      : t.motionNoFrames;
    motionOutput.textContent =
      preference +
      " · " +
      t.motionEvents +
      ": " +
      eventText +
      " · " +
      t.motionFrames +
      ": " +
      frames;
  }
  async function checkState(state, signal) {
    const probe = el("iframe", "rv-check-frame");
    probe.title = t.checks + " · " + state.title;
    probe.name = "ui-review-check/" + state.id;
    probe.srcdoc = config.appHtml;
    const abort = () => probe.remove();
    signal.addEventListener("abort", abort, { once: true });
    try {
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => finish(reject, Error(t.loading)), 6000);
        function finish(callback, value) {
          clearTimeout(timer);
          signal.removeEventListener("abort", cancelled);
          callback(value);
        }
        function cancelled() {
          finish(reject, signal.reason);
        }
        signal.addEventListener("abort", cancelled, { once: true });
        probe.addEventListener("load", () => finish(resolve), { once: true });
        stage.append(probe);
      });
      signal.throwIfAborted();
      const doc = probe.contentDocument;
      const definition = probe.contentWindow.reviewScenario;
      validate(definition);
      if (definition.checkIsolation !== true) throw Error(t.missing);
      const requested = definition.states.find((item) => item.id === state.id);
      if (!requested) throw Error("Unknown state " + state.id);
      const ordered = [...definition.states].sort(
        (a, b) =>
          (b.priority || 0) - (a.priority || 0) ||
          rank(b, definition) - rank(a, definition),
      );
      const ui = makeDriver(doc, signal);
      await requested.enter?.(ui);
      await ui.wait(
        () => ordered.find((item) => item.match())?.id === state.id,
        requested.title,
      );
      const actions =
        typeof requested.actions === "function"
          ? requested.actions()
          : requested.actions || [];
      function inspectActions() {
        const items = [];
        const absent = [];
        const required = [];
        for (const action of actions) {
          const node = target(action.target, doc);
          if (node) items.push({ action, node });
          else {
            absent.push(action.title);
            if (!action.optional) required.push(action.title);
          }
        }
        const discovery =
          requested.discoverActions ?? definition.discoverActions;
        if (discovery) discoverActions(doc, items, discovery);
        const present = items.map(
          ({ action, node }) =>
            action.title +
            (disabled(node) ? (zh ? "（禁用）" : " (disabled)") : ""),
        );
        return { present, absent, required };
      }
      let result = inspectActions();
      try {
        await ui.wait(() => {
          result = inspectActions();
          return result.present.length && !result.required.length;
        }, t.missing);
      } catch (error) {
        if (signal.aborted) throw error;
        throw Error(
          t.missing + ": " + (result.required.join(" · ") || requested.title),
        );
      }
      return result;
    } finally {
      signal.removeEventListener("abort", abort);
      probe.remove();
    }
  }
  async function openChecks() {
    if (!scenario?.checkIsolation || checkController) return;
    const states = scenario.states.map(({ id, title }) => ({ id, title }));
    const controller = new AbortController();
    checkController = controller;
    checksList.replaceChildren();
    checksProgress.max = states.length;
    checksProgress.value = 0;
    checksStatus.textContent = t.checking + " 0 / " + states.length;
    stopChecks.hidden = false;
    checksDialog.showModal();
    let failures = 0;
    for (const [index, state] of states.entries()) {
      if (controller.signal.aborted) break;
      const row = el("li", "rv-check-row");
      const entry = el("details", "rv-check-entry");
      const summary = el("summary");
      const indicator = el("span", "rv-check-indicator");
      indicator.setAttribute("aria-hidden", "true");
      const outcome = el("span", "rv-check-outcome", t.checking);
      summary.append(indicator, el("strong", "", state.title), outcome);
      entry.append(summary);
      row.append(entry);
      checksList.append(row);
      try {
        const result = await checkState(state, controller.signal);
        entry.append(el("p", "", result.present.join(" · ")));
        if (result.absent.length)
          entry.append(
            el("small", "", t.unavailable + ": " + result.absent.join(" · ")),
          );
        row.dataset.result = "pass";
        outcome.textContent = t.passed;
      } catch (reason) {
        if (controller.signal.aborted) {
          outcome.textContent = t.stopped;
          break;
        }
        failures++;
        row.dataset.result = "fail";
        outcome.textContent = t.failed;
        entry.append(el("p", "", reason.message || String(reason)));
        entry.open = true;
      }
      checksProgress.value = index + 1;
      checksStatus.textContent =
        t.checking +
        " " +
        (index + 1) +
        " / " +
        states.length +
        (failures ? " · " + failures + (zh ? " 项失败" : " failed") : "");
    }
    checksStatus.textContent = controller.signal.aborted
      ? t.stopped
      : t.checked +
        " · " +
        (states.length - failures) +
        " / " +
        states.length +
        (failures ? " · " + failures + (zh ? " 项失败" : " failed") : "");
    stopChecks.hidden = true;
    checkController = undefined;
  }
  checksDialog.addEventListener("close", () => checkController?.abort());
  window.addEventListener("hashchange", () => {
    const state = new URLSearchParams(location.hash.slice(1)).get("state");
    if (state && state !== selected) load(state);
  });
  load(new URLSearchParams(location.hash.slice(1)).get("state") || "");
})();
</script></body></html>
